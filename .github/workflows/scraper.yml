name: Price Scraper Run

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *' # Runs daily at 08:00 UTC

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Price Scraper
        env:
          PRODUCTS_FILE: 'data/products.csv'
          STORES_FILE: 'data/stores.csv'
          MAX_WORKERS: '10'
        run: |
          python scraper.py

      - name: Upload Results to Domo
        env:
          client_id: ${{ secrets.DOMO_CLIENT_ID }}
          secret_id: ${{ secrets.DOMO_CLIENT_SECRET }}
          dataset_id: ${{ secrets.DOMO_DATASET_ID }}
        run: |
          python upload_to_domo.py

      - name: Upload Scraped Results (Artifact Backup)
        uses: actions/upload-artifact@v4
        if: always() # Ensures logs/artifacts uploaded even if scraping or domo upload partially fails
        with:
          name: scrape-results
          path: |
            results.json
            results.csv
          retention-days: 7